name: Lab CLI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lab-cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-core:
    name: Go core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4
      - name: Keep agent-tool folders out of product source
        working-directory: .
        run: |
          sh scripts/check-repo-hygiene.sh
          sh scripts/check-repo-hygiene.test.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: lab/go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o "${RUNNER_TEMP}/forgecell-go" ./cmd/forgecell
      - run: "${RUNNER_TEMP}/forgecell-go --version"
      - name: Check Go formatting
        run: test -z "$(gofmt -l internal cmd)"

      - name: Build versioned native CLI packages
        working-directory: .
        run: |
          sh scripts/build-native-release.sh 0.2.0-ci.1 "${RUNNER_TEMP}/native-releases"
          sh scripts/build-native-release.sh 0.2.0-ci.2 "${RUNNER_TEMP}/native-releases"
      - name: Verify HTTPS install, upgrade and rollback without Node or Go
        working-directory: .
        run: python3 scripts/test-native-installer.py "${RUNNER_TEMP}/native-releases" 0.2.0-ci.1 0.2.0-ci.2
      - uses: actions/upload-artifact@v4
        with:
          name: native-cli-${{ matrix.os }}
          path: ${{ runner.temp }}/native-releases/
          if-no-files-found: error
